<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Pagina non trovata | Repunto</title>
<script>
// Fino a ottobre 2026 su repunto.it c'era il negozio Payhip. I link che i clienti hanno ricevuto da Payhip
// (download /d/..., ordini, carrello, area clienti) continuano su payhip.com, dove il negozio resta aperto senza vendite.
// Perché funzioni, al cambio dei DNS il dominio repunto.it va scollegato da Payhip (Impostazioni → Domini).
(function () {
  var h = location.hostname, p = location.pathname;
  if ((h === 'repunto.it' || h === 'www.repunto.it') && /^\/(d|b|buy|cart|checkout|order|orders|account|Repunto|auth)(\/|$)/.test(p)) {
    location.replace('https://payhip.com' + p + location.search + location.hash);
  }
})();
</script>
<style>
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; background:#FAF6EE; color:#2F3432; font-family:"Libre Baskerville", Georgia, serif; text-align:center; padding:24px; line-height:1.7; }
  h1 { font-weight:400; font-size:34px; margin:0 0 12px; }
  a { color:#9A7612; }
</style>
</head>
<body>
  <main>
    <h1>Questa pagina non c'è</h1>
    <p>Forse si è spostata. <a id="home" href="https://repunto.it/">Torna alla home di Repunto</a>, guarda le <a id="schede" href="https://repunto.it/schede-per-cucire">schede per cucire</a> o le <a id="borse" href="https://repunto.it/borse-accessori-repunto-disponibili">borse disponibili</a>.</p>
    <p>Cerchi una scheda comprata prima di novembre 2026? Scrivimi a <a href="mailto:repunto.studio@gmail.com">repunto.studio@gmail.com</a> e te la mando.</p>
  </main>
<script>
// nella bozza su github.io il sito sta sotto /sito-repunto/, nell'anteprima sul PC sotto /
(function () {
  var base = location.hostname.indexOf('github.io') !== -1 ? '/sito-repunto/' : (location.hostname === 'localhost' ? '/' : null);
  if (!base) return;
  document.getElementById('home').href = base;
  document.getElementById('schede').href = base + 'schede-per-cucire';
  document.getElementById('borse').href = base + 'borse-accessori-repunto-disponibili';
})();
</script>
</body>
</html>
