<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Pagina non trovata | Repunto</title>
<script>
// Su repunto.it gli indirizzi che il sito non conosce (download dei clienti, carrello, prodotti) sono dello shop Payhip:
// si rimanda allo stesso percorso su shop.repunto.it, così i link vecchi continuano a funzionare.
(function () {
  var h = location.hostname;
  if (h === 'repunto.it' || h === 'www.repunto.it') {
    location.replace('https://shop.repunto.it' + location.pathname + location.search + location.hash);
  }
})();
</script>
<style>
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; background:#FAF6EE; color:#2F3432; font-family:"Libre Baskerville", Georgia, serif; text-align:center; padding:24px; line-height:1.7; }
  h1 { font-weight:400; font-size:34px; margin:0 0 12px; }
  a { color:#9A7612; }
</style>
</head>
<body>
  <main>
    <h1>Questa pagina non c'è</h1>
    <p>Forse si è spostata. <a id="home" href="https://repunto.it/">Torna alla home di Repunto</a> o <a href="https://shop.repunto.it/">vai allo shop</a>.</p>
  </main>
<script>
// nella bozza su github.io la home sta sotto /sito-repunto/
if (location.hostname.indexOf('github.io') !== -1) document.getElementById('home').href = '/sito-repunto/';
</script>
</body>
</html>
